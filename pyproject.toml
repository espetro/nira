[project]
name = "nira"
version = "0.1.0"
description = "Manifest-first, idempotent fleet replicator CLI"
requires-python = ">=3.12"
dependencies = [
    "pyinfra>=3.10",
    "textual>=0.80",
    "rich>=13.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
nira = "nira.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nira"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
